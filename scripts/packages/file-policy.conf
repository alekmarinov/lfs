# What to do when more than one package ships the same file.
#
# A package is an overlay upper layer: everything its build wrote, as final
# content. That records what a file ended up containing but not whether the
# package created it or changed one line of someone else's. Unpacking packages
# in order therefore keeps only the last writer, and for a file which several
# packages add to - /etc/passwd, where every service account lands - everything
# the earlier ones contributed is lost. A distro then boots with "no such user
# dhcpcd" while dhcpcd is installed.
#
# Each line below is a decision about one path:
#
#   <pattern>  <strategy>
#
#   merge-lines:<field>  union the lines of the file, keyed on that colon
#                        separated field. The copy just unpacked is kept and
#                        any key it does not mention is appended.
#   regenerate           never install it from a package. It describes the
#                        tree rather than being authored, so it is dropped and
#                        rebuilt after assembly.
#   drop                 never ship it at all.
#   last-wins            unpack over the top, which is what happens without a
#                        policy. Stated explicitly: it means someone looked and
#                        decided, rather than nobody having considered it.
#
# The first matching pattern wins, so put specific paths before globs.
#
# A file under /etc or /var which several packages ship and which is not
# matched here stops the assembly. That is the point of the file: a new
# accumulator cannot appear silently the way /etc/passwd did.

# ---- accounts: every package which adds a service account rewrites the lot
/etc/passwd                             merge-lines:1
/etc/group                              merge-lines:1
/etc/shadow                             merge-lines:1
/etc/gshadow                            merge-lines:1

# ---- generated from the contents of the tree, rebuilt after assembly
/etc/ld.so.cache                        regenerate
/var/cache/ldconfig/aux-cache           regenerate
/var/cache/fontconfig/*                 regenerate
/usr/share/mime/mime.cache              regenerate
/usr/share/glib-2.0/schemas/gschemas.compiled   regenerate
/usr/share/icons/*/icon-theme.cache     regenerate
/usr/lib/gdk-pixbuf-2.0/*/loaders.cache regenerate

# ---- artefacts of the build which no image should carry
/etc/.pwd.lock                          drop
/etc/passwd-                            drop
/etc/group-                             drop
/etc/shadow-                            drop
/etc/gshadow-                           drop
/var/log/lastlog                        drop
/var/log/faillog                        drop
/var/log/btmp                           drop
/var/log/wtmp                           drop

# ---- genuinely owned, and the later package is the one to keep
/etc/login.defs                         last-wins
/etc/login.access                       last-wins
/etc/limits                             last-wins
/etc/grub.d/*                           last-wins
/etc/hosts                              last-wins
/etc/syslog.conf                        last-wins
/etc/sysconfig/rc.site                  last-wins
/etc/sysconfig/createfiles              last-wins
