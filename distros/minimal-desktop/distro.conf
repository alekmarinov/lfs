# Identity of the distro, used to generate /etc/os-release, /etc/<ID>-release,
# /etc/lsb-release and /etc/hostname, to title the grub menu entry and to name
# the docker image.
ID=minimal-desktop
NAME="Minimal Desktop LFS"
VERSION=11.2
CODENAME=fetus
PRETTY_NAME="Minimal Desktop LFS 11.2"
DISTRO_HOSTNAME=minimal-desktop
HOME_URL="https://www.linuxfromscratch.org/blfs/"
GRUB_TIMEOUT=5

# remove the debug symbols from the programs and libraries of the distro
STRIP=1
