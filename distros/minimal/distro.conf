# Identity of the distro, used to generate /etc/os-release, /etc/<ID>-release,
# /etc/lsb-release and /etc/hostname, to title the grub menu entry and to name
# the docker image.
ID=minimal
NAME="Minimal LFS"
VERSION=12.4
CODENAME=fetus
PRETTY_NAME="Minimal LFS 12.4"
DISTRO_HOSTNAME=minimal
HOME_URL="https://www.linuxfromscratch.org/lfs/"
GRUB_TIMEOUT=5

# remove the debug symbols from the programs and libraries of the distro
STRIP=1

# The image size in MB. Big enough for the assembled tree plus room to install
# into afterwards. 7G still fits an 8G USB stick. This was one number in .env
# for every distro until 2026-08-31; the value is unchanged, but each distro
# can now be sized for what it actually holds once that has been measured.
IMAGE_SIZE=7168
