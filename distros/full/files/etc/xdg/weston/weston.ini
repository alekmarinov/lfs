# The compositor this distro boots into.
#
# cog used to draw straight to KMS with nothing between it and the screen,
# which sounds ideal and was not: cog's DRM backend is the one upstream
# exercises least. It has no fullscreen handling at all, its cursor path
# cannot find a plane, and it crashed on any connector reporting no modes.
# Running a compositor puts cog on its Wayland platform, which is the path
# everyone else uses.

[core]
# lua rather than kiosk. kiosk gives every window a whole output and asks no
# questions, which is all this needs today - but the layout policy here is a
# script, and changing how windows are placed should not mean rebuilding a
# compositor. /usr/libexec/shell.lua is weston's default and already tiles.
shell=lua-shell.so
backend=drm-backend.so

# Start even with no input device attached. A machine that shows a page and
# is never touched is a normal thing here, and refusing to start without a
# keyboard is not helpful on an appliance.
require-input=false

# Never blank. The default idle timeout dims and then blanks the output, which
# for a screen whose entire job is to be looked at is a fault rather than a
# saving.
idle-time=0

[autolaunch]
# The browser. watch=true ties the two together: when cog exits weston exits,
# rather than leaving a compositor showing an empty desktop nothing can reach.
path=/usr/bin/cog-launch
watch=true
