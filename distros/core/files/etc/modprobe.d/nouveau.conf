# nouveau takes the console away and does not give it back.
#
# On an nvidia card udev loads nouveau once userspace starts. The driver
# deactivates the console it finds - the log reads
#
#     Console: switching to colour dummy device 80x25
#     nouveau 0000:01:00.0: vgaarb: deactivate vga console
#
# - and reprograms the gpu, so the framebuffer the firmware handed over stops
# being scanned out. Nothing binds a console after that: the screen stays lit
# and empty for the rest of the boot, with no message to say why.
#
# Confirmed on a GF119 (GeForce GT 6xx) in an ASUS P9X79. Without this file
# that machine boots to an invisible login prompt.
#
# The cost is that X gets no accelerated driver and runs on the firmware
# framebuffer at whatever mode the firmware set. Remove this file to give
# nouveau another try, and watch for the two lines above.
blacklist nouveau
